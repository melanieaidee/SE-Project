<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

<section class="login-section">
  <div class="login-box">

    <!-- IMPORTANT: method POST + action to Django login -->
    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <h2>Login</h2>

      <!-- USERNAME FIELD -->
      <div class="input-box">
        <span class="icon"><ion-icon name="person"></ion-icon></span>
        <input type="text" name="username" required>
        <label>Username</label>
      </div>

      <!-- PASSWORD FIELD -->
      <div class="input-box">
        <!--<span class="icon"><ion-icon name="lock-closed"></ion-icon></span> !-->
        <span class = "icon" onclick = "togglePassword()">
          <ion-icon id = "eyeIcon" name = "eye-off-outline"></ion-icon>
        </span>
       <!---- <span class="icon"><ion-icon name="eye-outline"></ion-icon></ion-iconion-icon></span> !-->
        <input type="password" id="password" name = "password" required>
        <label>Password</label>
      </div>

      <button type="submit">Login</button>

      <div class="register-link">
        <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
      </div>
    </form>

  </div>
</section>

<script>
function togglePassword() {
  const password = document.getElementById("password");
  const eyeIcon = document.getElementById("eyeIcon");

  if(password.type == "password") {
    password.type = "text";
    eyeIcon.name = "eye-outline";
  }
  else {
    password.type = "password";
    eyeIcon.name = "eye-off-outline";
  }
}
</script>

<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
