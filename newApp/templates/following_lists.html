{% extends 'base.html' %}
{% block content %}

<h1>{{ list_users.username }} is Following</h1>

{% for f in following %}
    <div>
        <a href="{% url 'user_profile' f.following.username %}">
            {{ f.following.username }}
        </a>
    </div>
{% empty %}
    <p>Not following anyone.</p>
{% endfor %}

{% endblock %}
