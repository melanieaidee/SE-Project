{% extends 'base.html' %}
{% block content %}

<h2>Simple Chat</h2>

<div id="messages" style="
    width: 100%;
    height: 300px;
    border: 1px solid #ccc;
    overflow-y: scroll;
    padding: 10px;
    margin-bottom: 10px;">
</div>

<input id="chatInput" type="text" placeholder="Type a message">
<button onclick="sendMessage()">Send</button>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>

<script>
    // Your Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyAGQx0vW8Rn0aabnTZlHbVcn2EeyXEwz3o",
        authDomain: "finalproject-6a2ef.firebaseapp.com",
        databaseURL: "https://finalproject-6a2ef-default-rtdb.firebaseio.com",
        projectId: "finalproject-6a2ef",
        storageBucket: "finalproject-6a2ef.firebasestorage.app",
        messagingSenderId: "157565450838",
        appId: "1:157565450838:web:0fa11cab6374ab486ed9f7"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Temporary test users (we will replace with Django variables later)
    const currentUserId = "anna";
    const otherUserId = "john";

    // Create a unique conversation ID
    function getConversationId(a, b) {
        return a < b ? a + "_" + b : b + "_" + a;
    }

    const conversationId = getConversationId(currentUserId, otherUserId);
    const messagesRef = db.ref("dmChats/" + conversationId + "/messages");

    // Send a message
    function sendMessage() {
        const text = document.getElementById("chatInput").value;
        if (text.trim() === "") return;

        messagesRef.push({
            senderId: currentUserId,
            text: text,
            timestamp: Date.now()
        });

        document.getElementById("chatInput").value = "";
    }

    // Listen for new messages
    messagesRef.on("child_added", (snapshot) => {
        const msg = snapshot.val();
        const div = document.createElement("div");
        div.style.padding = "5px";
        div.style.marginBottom = "5px";
        div.style.background = "#f1f1f1";
        div.style.borderRadius = "5px";
        div.textContent = msg.senderId + ": " + msg.text;
        document.getElementById("messages").appendChild(div);
    });
</script>

{% endblock %}
