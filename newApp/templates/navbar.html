<link href="https://fonts.googleapis.com/css2?family=Frijole&display=swap" rel="stylesheet">

<nav>
    <!-- LEFT SIDE -->
    <div class="nav-left">
        <span class="logo-text">VaqueroConnect</span>
    </div>

    <!-- RIGHT SIDE -->
    <div class="nav-right">

        <!-- CREATE POST BUTTON -->
        {% if request.user.is_authenticated %}
        <a href="{% url 'create_post' %}" class="create-btn" title="Create Post">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white" class="bi bi-plus-circle" viewBox="0 0 16 16">
                <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1m0 1a6 6 0 1 1 0 12A6 6 0 0 1 8 2"/>
                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
            </svg>
        </a>
        {% endif %}

        <!-- HOME LINK -->
        {% if request.resolver_match.url_name != 'home' %}
        <a href="{% url 'main_home' %}">Home</a>
        {% endif %}

        {% if request.user.is_authenticated %}

            <!-- NOTIFICATION ICON -->
            <a href="{% url 'notifications-page' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white" class="bi bi-bell" viewBox="0 0 16 16">
                    <path d="M8 16a2 2 0 0 0 1.985-1.75H6.015A2 2 0 0 0 8 16m.104-14.042a1 1 0 1 0-2.208 0A5.002 5.002 0 0 0 3 6c0 1.098-.5 2.598-1.528 3.854-.287.36-.472.81-.472 1.29 0 .552.448 1 1 1h12a1 1 0 0 0 1-1c0-.48-.185-.93-.472-1.29C13.5 8.598 13 7.098 13 6a5.002 5.002 0 0 0-3.896-4.042"/>
                </svg>
            </a>

            <a href="{% url 'profile' request.user.username %}">Profile</a>
            <a href="{% url 'logout' %}">Logout</a>

        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}

    </div>
</nav>

<style>
    nav {
        background-color: #d14003;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo-text {
        font-family: 'Frijole', cursive;
        font-size: 28px;
        color: white;
        letter-spacing: 2px;
    }

    .nav-right a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-size: 18px;
        transition: color 0.3s ease;
    }

    .nav-right a:hover {
        color: #2c2a27;
    }

    /* Style for the + button */
    .create-btn svg {
        vertical-align: middle;
        transition: transform 0.2s ease;
    }

    .create-btn:hover svg {
        transform: scale(1.15);
    }
    
</style>
