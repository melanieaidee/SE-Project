{% extends "base.html" %}
{% load static %}

{% block content %}

<style>
    .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
    }

    .notif-card {
        background: #fff;
        padding: 15px 20px;
        border-radius: 8px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
    }

    .empty {
        text-align: center;
        font-size: 20px;
        color: #555;
        margin-top: 40px;
    }
</style>

<div class="container">
    <h2>Your Notifications</h2>

    {% if notifications %}
        {% for notif in notifications %}
            <div class="notif-card">
                {{ notif.message }}
            </div>
        {% endfor %}
    {% else %}
        <p class="empty">You have no notifications.</p>
    {% endif %}
</div>

{% endblock %}
