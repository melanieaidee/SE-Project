<h2>Register</h2>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Create account</button>
</form>

<a href="{% url 'login' %}">Login</a>
#if there are any errors in the form it will display them
{% if form.errors %}
    <div class="errors">
        {{ form.errors }}
    </div>
{% endif %}
