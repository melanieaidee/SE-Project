{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- Bootstrap -->
<link 
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
  rel="stylesheet"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
  crossorigin="anonymous"
/>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<!-- CSS -->
<link rel="stylesheet" href="{% static 'comment_feed.css' %}?v=10">

<div class="comments-wrapper">

    <!-- HEADER -->
    <div class="comments-header">

        <a href="{% url 'main_home' %}" class="back-arrow">
            <i class="bi bi-arrow-left"></i>
        </a>

        <span class="comments-title">
            Comments
        </span>

    </div>

    <!-- POST CARD -->
    <div class="post-card">

        <!-- POST HEADER -->
        <div class="post-header">

            <!-- PROFILE PIC -->
            <img 
                src="{{ post.user.profile.image.url }}" 
                class="profile-pic-chat"
                alt="Profile Picture"
            >

            <!-- USERNAME -->
            <a href="{% url 'profile' post.user.username %}" class="post-username">
                {{ post.user.username }}
            </a>

        </div>

        <!-- POST TEXT -->
        <p class="post-text">
            {{ post.content }}
        </p>

        <!-- POST IMAGE -->
        {% if post.image %}
            <img src="{{ post.image.url }}" class="post-image">
        {% endif %}

    </div>

    <!-- COMMENTS -->
    <div class="comments-area">

        {% for c in comments %}

        <div class="comment-item">

            <!-- COMMENT PROFILE -->
            <img 
                src="{{ c.user.profile.image.url }}" 
                class="comment-profile"
                alt="Comment Profile"
            >

            <!-- COMMENT BUBBLE -->
            <div class="comment-bubble">

                <a href="{% url 'profile' c.user.username %}" class="comment-username">
                    {{ c.user.username }}
                </a>

                <div class="comment-text">
                    {{ c.text }}
                </div>

            </div>

        </div>

        {% empty %}

        <div class="no-comments">
            No comments yet.
        </div>

        {% endfor %}

    </div>

</div>

<!-- INPUT -->
<form 
    action="{% url 'add_comment' post.id %}" 
    method="POST"
    class="comment-input-bar"
>

    {% csrf_token %}

    <input 
        type="text"
        name="text"
        class="comment-input"
        placeholder="Add a comment..."
        required
    >

    <button class="send-btn">
        Post
    </button>

</form>

{% endblock %}
